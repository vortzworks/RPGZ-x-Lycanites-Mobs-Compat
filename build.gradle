plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'com.vortz.rpgzlycanites'

base {
    archivesName = 'rpgz-lycanites-compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Mixin annotations only (the game provides the runtime). No Lycanites or RpgZ
    // jar is needed to compile: the target class is referenced by name and the
    // RpgZ inventory is reached via reflection.
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

jar {
    manifest {
        attributes([
            'MixinConfigs': 'rpgz_lycanites_compat.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
